<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO // CLASSIC SUITE</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <!-- Paho MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #121722;
            --surface-card: #161d2b;
            --surface-hover: #1c2536;
            --border: #222c3d;
            --border-active: #d4af37;
            --gold: #e5b842;
            --gold-glow: rgba(229, 184, 66, 0.25);
            --cyan: #00e5ff;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-sub: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* --- Header with Mini EMO Screen --- */
        .header-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Mini Compact EMO Display */
        .mini-emo-screen {
            width: 58px;
            height: 38px;
            background: #020408;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 229, 255, 0.15);
        }

        .emo-mini-eye {
            width: 15px;
            height: 18px;
            background: var(--cyan);
            border-radius: 5px;
            box-shadow: 0 0 6px var(--cyan);
            animation: miniBlink 4s infinite ease-in-out;
        }

        @keyframes miniBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .title-meta h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--text-main);
        }

        .title-meta p {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .net-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: #0a111a;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-muted);
        }

        .net-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .net-badge.online {
            color: var(--green);
            border-color: rgba(16, 185, 129, 0.3);
        }
        .net-badge.online .net-dot {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .net-badge.offline {
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .net-badge.offline .net-dot {
            background: var(--red);
        }

        /* --- Master Bar (Solid Utility) --- */
        .master-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .master-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .master-btn:active {
            background: var(--surface-hover);
            transform: scale(0.98);
        }

        /* --- Device List (Balanced & Filled) --- */
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 0 2px;
            display: flex;
            justify-content: space-between;
        }

        .device-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .device-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .device-card:active {
            transform: scale(0.985);
        }

        .device-card.active {
            background: #19202e;
            border-color: var(--border-active);
            box-shadow: 0 4px 16px var(--gold-glow);
        }

        .device-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            transition: all 0.25s;
        }

        .device-icon-box svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .device-card.active .device-icon-box {
            background: var(--gold);
            color: #0b0e14;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(229, 184, 66, 0.4);
        }

        /* Fan Spin */
        .device-card.active #fan-icon svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .device-info h2 {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
        }

        .device-info p {
            font-size: 0.66rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        /* Modern Compact Pill Switch */
        .pill-switch {
            width: 44px;
            height: 24px;
            background: #0d121c;
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            transition: all 0.25s;
        }

        .pill-knob {
            width: 18px;
            height: 18px;
            background: var(--text-muted);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .device-card.active .pill-switch {
            background: rgba(229, 184, 66, 0.2);
            border-color: var(--gold);
        }

        .device-card.active .pill-knob {
            transform: translateX(20px);
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
        }

        /* --- Footer Status Strip --- */
        .status-strip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-strip b {
            color: var(--cyan);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div class="brand-cluster">
            <div class="mini-emo-screen">
                <div class="emo-mini-eye"></div>
                <div class="emo-mini-eye"></div>
            </div>
            <div class="title-meta">
                <h1>EMO Hub Executive</h1>
                <p>ESP32-S3 // ESP-NOW MESH</p>
            </div>
        </div>
        <div class="net-badge" id="net-badge">
            <div class="net-dot"></div>
            <span id="net-text">CONNECTING</span>
        </div>
    </div>

    <!-- Quick Utilities -->
    <div class="master-bar">
        <div class="master-btn" onclick="masterControl(true)">
            <span>⚡ ALL ON</span>
        </div>
        <div class="master-btn" onclick="masterControl(false)">
            <span>✕ ALL OFF</span>
        </div>
    </div>

    <!-- Relays List -->
    <div class="section-label">
        <span>Relay Modules</span>
        <span id="active-count">0 Active</span>
    </div>

    <div class="device-stack">
        <!-- Light 1 -->
        <div class="device-card" id="card-1" onclick="toggleDevice(1)">
            <div class="device-left">
                <div class="device-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9z"/></svg>
                </div>
                <div class="device-info">
                    <h2>Ceiling Light</h2>
                    <p>GPIO 18 • RELAY 01</p>
                </div>
            </div>
            <div class="pill-switch"><div class="pill-knob"></div></div>
        </div>

        <!-- Light 2 -->
        <div class="device-card" id="card-2" onclick="toggleDevice(2)">
            <div class="device-left">
                <div class="device-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9z"/></svg>
                </div>
                <div class="device-info">
                    <h2>Desk Lamp</h2>
                    <p>GPIO 19 • RELAY 02</p>
                </div>
            </div>
            <div class="pill-switch"><div class="pill-knob"></div></div>
        </div>

        <!-- Fan -->
        <div class="device-card" id="card-3" onclick="toggleDevice(3)">
            <div class="device-left">
                <div class="device-icon-box" id="fan-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 11a1 1 0 1 0 1 1 1 1 0 0 0-1-1m0-9a4 4 0 0 0-4 4c0 2.5 2 3.5 4 4.5 2-1 4-2 4-4.5a4 4 0 0 0-4-4m-9 9a4 4 0 0 0 4 4c2.5 0 3.5-2 4.5-4-1-2-2-4-4.5-4a4 4 0 0 0-4 4m9 9a4 4 0 0 0 4-4c0-2.5-2-3.5-4-4.5-2 1-4 2-4 4.5a4 4 0 0 0 4 4m9-9a4 4 0 0 0-4-4c-2.5 0-3.5 2-4.5 4 1 2 2 4 4.5 4a4 4 0 0 0 4-4"/></svg>
                </div>
                <div class="device-info">
                    <h2>Cooling Fan</h2>
                    <p>GPIO 21 • RELAY 03</p>
                </div>
            </div>
            <div class="pill-switch"><div class="pill-knob"></div></div>
        </div>

        <!-- TV -->
        <div class="device-card" id="card-4" onclick="toggleDevice(4)">
            <div class="device-left">
                <div class="device-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 14H3V5h18z"/></svg>
                </div>
                <div class="device-info">
                    <h2>Main TV Power</h2>
                    <p>GPIO 22 • RELAY 04</p>
                </div>
            </div>
            <div class="pill-switch"><div class="pill-knob"></div></div>
        </div>
    </div>

    <!-- Status Strip -->
    <div class="status-strip">
        <span>BROKER: <b>EMQX IO</b></span>
        <span id="log-msg">READY</span>
    </div>

    <script>
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const TOPIC_RELAY = "dheeraj_emo_hub_9921/control/relay";
        const TOPIC_STATUS_WILDCARD = "dheeraj_emo_hub_9921/status/#";
        const CLIENT_ID = "emo_classic_" + Math.random().toString(16).substr(2, 8);

        const states = { 1: false, 2: false, 3: false, 4: false };
        let mqttConnected = false;
        const mqttClient = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), CLIENT_ID);

        function updateUI(id, state) {
            states[id] = state;
            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (state) card.classList.add("active");
                else card.classList.remove("active");
            }

            // Update active count
            const count = Object.values(states).filter(Boolean).length;
            document.getElementById("active-count").innerText = `${count} Active`;
        }

        function triggerVibe() {
            if ("vibrate" in navigator) navigator.vibrate(20);
        }

        function toggleDevice(id) {
            triggerVibe();
            const next = !states[id];
            updateUI(id, next);

            if (mqttConnected) {
                const payload = JSON.stringify({ id: Number(id), state: next ? 1 : 0 });
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_RELAY;
                message.qos = 1;
                mqttClient.send(message);
                document.getElementById("log-msg").innerText = `DEV 0${id} -> ${next ? 'ON' : 'OFF'}`;
            }
        }

        function masterControl(state) {
            triggerVibe();
            for (let i = 1; i <= 4; i++) {
                if (states[i] !== state) {
                    toggleDevice(i);
                }
            }
        }

        // Live Retained Sync
        mqttClient.onMessageArrived = function (msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                const id = Number(data.id);
                const state = (Number(data.state) === 1);
                updateUI(id, state);
                document.getElementById("log-msg").innerText = `SYNC DEV 0${id}`;
            } catch (e) {}
        };

        mqttClient.onConnectionLost = function () {
            mqttConnected = false;
            const badge = document.getElementById("net-badge");
            badge.className = "net-badge offline";
            document.getElementById("net-text").innerText = "OFFLINE";
            setTimeout(connectBroker, 3000);
        };

        function connectBroker() {
            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                keepAliveInterval: 30,
                cleanSession: false,
                onSuccess: function () {
                    mqttConnected = true;
                    const badge = document.getElementById("net-badge");
                    badge.className = "net-badge online";
                    document.getElementById("net-text").innerText = "CONNECTED";
                    mqttClient.subscribe(TOPIC_STATUS_WILDCARD, { qos: 1 });
                },
                onFailure: function () {
                    mqttConnected = false;
                    const badge = document.getElementById("net-badge");
                    badge.className = "net-badge offline";
                    document.getElementById("net-text").innerText = "RETRYING";
                    setTimeout(connectBroker, 5000);
                }
            });
        }

        connectBroker();
    </script>
</body>
</html>

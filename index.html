<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO // NEXUS HOME OS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg-deep: #07090e;
            --surface: rgba(18, 24, 38, 0.65);
            --surface-hover: rgba(28, 38, 60, 0.75);
            --surface-border: rgba(255, 255, 255, 0.08);
            --cyan-glow: #00f0ff;
            --amber-active: #ffb300;
            --amber-glow: rgba(255, 179, 0, 0.35);
            --emerald-online: #00e676;
            --rose-offline: #ff1744;
            --text-primary: #f0f4f8;
            --text-secondary: #8292a2;
            --card-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 179, 0, 0.04), transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 18px 40px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow-x: hidden;
            transition: background 0.6s ease;
        }

        body.ambient-lit {
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(255, 179, 0, 0.18), transparent 60%),
                radial-gradient(circle at 50% 85%, rgba(0, 240, 255, 0.06), transparent 50%);
        }

        /* --- Ambient Header --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span {
            color: var(--cyan-glow);
            text-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
            box-shadow: 0 0 8px currentColor;
        }

        .status-pill.online {
            border-color: rgba(0, 230, 118, 0.3);
            color: var(--emerald-online);
        }
        .status-pill.online .status-dot {
            background: var(--emerald-online);
        }

        .status-pill.offline {
            border-color: rgba(255, 23, 68, 0.3);
            color: var(--rose-offline);
        }
        .status-pill.offline .status-dot {
            background: var(--rose-offline);
        }

        /* --- Living EMO Glass Hub --- */
        .emo-hub-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 26px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .emo-display-frame {
            width: 170px;
            height: 82px;
            background: #020408;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 240, 255, 0.15);
        }

        .emo-screen-canvas {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .squircle-eye {
            width: 48px;
            height: 52px;
            background: var(--cyan-glow);
            border-radius: 15px;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.8), inset -2px -2px 6px rgba(0, 150, 200, 0.8);
            animation: naturalBlink 4.5s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        @keyframes naturalBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.06); }
        }

        .hub-telemetry {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .hub-telemetry b {
            color: var(--cyan-glow);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }

        /* --- Section Label --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .section-header h2 {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .section-header span {
            font-size: 0.7rem;
            color: var(--cyan-glow);
            font-weight: 600;
        }

        /* --- HomeKit Style Interactive Grid --- */
        .device-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .tile {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--card-radius);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 148px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tile:active {
            transform: scale(0.97);
        }

        .tile::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .tile.active {
            background: rgba(36, 30, 16, 0.8);
            border-color: rgba(255, 179, 0, 0.45);
            box-shadow: 0 14px 30px var(--amber-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .tile.active::after {
            opacity: 1;
        }

        .tile-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .icon-circle svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .tile.active .icon-circle {
            background: var(--amber-active);
            color: #0d0e12;
            box-shadow: 0 0 16px rgba(255, 179, 0, 0.6);
        }

        /* Fan spin when active */
        .tile.active #fan-icon svg {
            animation: spinFast 0.85s linear infinite;
        }

        @keyframes spinFast {
            100% { transform: rotate(360deg); }
        }

        .state-chip {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .tile.active .state-chip {
            color: var(--amber-active);
        }

        .tile-bottom {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .device-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .device-sub {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        /* --- Minimal Terminal Log --- */
        .live-log-card {
            background: rgba(8, 11, 16, 0.7);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .log-text {
            font-family: 'Space Grotesk', monospace;
            font-size: 0.72rem;
            color: var(--cyan-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="top-bar">
        <div class="brand-title">EMO <span>NEXUS</span></div>
        <div class="status-pill" id="net-status">
            <div class="status-dot"></div>
            <span id="net-label">CONNECTING</span>
        </div>
    </div>

    <!-- Living Expression Screen -->
    <div class="emo-hub-card">
        <div class="emo-display-frame">
            <div class="emo-screen-canvas">
                <div class="squircle-eye" id="eye-left"></div>
                <div class="squircle-eye" id="eye-right"></div>
            </div>
        </div>
        <div class="hub-telemetry">
            <span>LINK: <b>EMQX CLOUD</b></span>
            <span>RADIO: <b>ESP-NOW FAST</b></span>
            <span>LATENCY: <b>&lt; 20ms</b></span>
        </div>
    </div>

    <!-- Controls Grid -->
    <div class="section-header">
        <h2>Appliance Relays</h2>
        <span>4 CHANNELS ACTIVE</span>
    </div>

    <div class="device-grid">
        <!-- Light 1 -->
        <div class="tile" id="tile-1" onclick="toggleDevice(1)">
            <div class="tile-top">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9z"/></svg>
                </div>
                <div class="state-chip" id="chip-1">OFF</div>
            </div>
            <div class="tile-bottom">
                <div class="device-name">Ceiling Light</div>
                <div class="device-sub">Channel 01</div>
            </div>
        </div>

        <!-- Light 2 -->
        <div class="tile" id="tile-2" onclick="toggleDevice(2)">
            <div class="tile-top">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9z"/></svg>
                </div>
                <div class="state-chip" id="chip-2">OFF</div>
            </div>
            <div class="tile-bottom">
                <div class="device-name">Lamp Light</div>
                <div class="device-sub">Channel 02</div>
            </div>
        </div>

        <!-- Fan -->
        <div class="tile" id="tile-3" onclick="toggleDevice(3)">
            <div class="tile-top">
                <div class="icon-circle" id="fan-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 11a1 1 0 1 0 1 1 1 1 0 0 0-1-1m0-9a4 4 0 0 0-4 4c0 2.5 2 3.5 4 4.5 2-1 4-2 4-4.5a4 4 0 0 0-4-4m-9 9a4 4 0 0 0 4 4c2.5 0 3.5-2 4.5-4-1-2-2-4-4.5-4a4 4 0 0 0-4 4m9 9a4 4 0 0 0 4-4c0-2.5-2-3.5-4-4.5-2 1-4 2-4 4.5a4 4 0 0 0 4 4m9-9a4 4 0 0 0-4-4c-2.5 0-3.5 2-4.5 4 1 2 2 4 4.5 4a4 4 0 0 0 4-4"/></svg>
                </div>
                <div class="state-chip" id="chip-3">OFF</div>
            </div>
            <div class="tile-bottom">
                <div class="device-name">Cooling Fan</div>
                <div class="device-sub">Channel 03</div>
            </div>
        </div>

        <!-- TV -->
        <div class="tile" id="tile-4" onclick="toggleDevice(4)">
            <div class="tile-top">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 14H3V5h18z"/></svg>
                </div>
                <div class="state-chip" id="chip-4">OFF</div>
            </div>
            <div class="tile-bottom">
                <div class="device-name">Television</div>
                <div class="device-sub">Channel 04</div>
            </div>
        </div>
    </div>

    <!-- Clean Log Feed -->
    <div class="live-log-card">
        <div class="log-title">Telemetry Activity</div>
        <div class="log-text" id="log-msg">Ready. Connecting to Secure Broker...</div>
    </div>

    <script>
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const TOPIC_RELAY = "dheeraj_emo_hub_9921/control/relay";
        const TOPIC_STATUS_WILDCARD = "dheeraj_emo_hub_9921/status/#";
        const CLIENT_ID = "emo_web_nexus_" + Math.random().toString(16).substr(2, 8);

        const states = { 1: false, 2: false, 3: false, 4: false };
        let mqttConnected = false;
        const mqttClient = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), CLIENT_ID);

        function setStatus(text, statusClass) {
            const badge = document.getElementById("net-status");
            const label = document.getElementById("net-label");
            label.innerText = text;
            badge.className = "status-pill " + statusClass;
        }

        function setLog(text) {
            document.getElementById("log-msg").innerText = text;
        }

        function triggerHaptic() {
            if ("vibrate" in navigator) {
                navigator.vibrate(25);
            }
        }

        function applyVisuals(id, state) {
            states[id] = state;
            const tile = document.getElementById(`tile-${id}`);
            const chip = document.getElementById(`chip-${id}`);

            if (state) {
                tile.classList.add("active");
                chip.innerText = "ON";
            } else {
                tile.classList.remove("active");
                chip.innerText = "OFF";
            }

            // Room ambient glow check
            if (states[1] || states[2]) {
                document.body.classList.add("ambient-lit");
            } else {
                document.body.classList.remove("ambient-lit");
            }
        }

        function toggleDevice(id) {
            triggerHaptic();
            const nextState = !states[id];
            applyVisuals(id, nextState);

            if (mqttConnected) {
                const payload = JSON.stringify({ id: Number(id), state: nextState ? 1 : 0 });
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_RELAY;
                message.qos = 1;
                mqttClient.send(message);
                setLog(`Executed -> Channel 0${id} set to ${nextState ? 'ACTIVE' : 'IDLE'}`);
            } else {
                setLog("Network warning: Disconnected from broker.");
            }
        }

        // --- Live Sync Arrived from ESP32 / Cloud ---
        mqttClient.onMessageArrived = function (message) {
            try {
                const data = JSON.parse(message.payloadString);
                const id = Number(data.id);
                const state = (Number(data.state) === 1);
                applyVisuals(id, state);
                setLog(`Live Sync: Device 0${id} verified [${state ? 'ON' : 'OFF'}]`);
            } catch (e) {
                console.error("Payload parse error", e);
            }
        };

        mqttClient.onConnectionLost = function () {
            mqttConnected = false;
            setStatus("OFFLINE", "offline");
            setLog("Link lost. Retrying in 3 seconds...");
            setTimeout(connectBroker, 3000);
        };

        function connectBroker() {
            setStatus("CONNECTING", "");
            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                keepAliveInterval: 30,
                cleanSession: false,
                onSuccess: function () {
                    mqttConnected = true;
                    setStatus("ONLINE", "online");
                    setLog("Subscribed to EMO Hub Cloud. Ready.");
                    mqttClient.subscribe(TOPIC_STATUS_WILDCARD, { qos: 1 });
                },
                onFailure: function () {
                    mqttConnected = false;
                    setStatus("ERROR", "offline");
                    setTimeout(connectBroker, 5000);
                }
            });
        }

        connectBroker();
    </script>
</body>
</html>

<script>
        // =======================================================
        // 1. FAST INTRO PIPELINE (No Lag)
        // =======================================================
        function runIntroSequence() {
            const overlay = document.getElementById('intro-overlay');
            // Turant background mein vanish kar do taaki lag na lage
            setTimeout(() => {
                if (overlay) overlay.classList.add('vanished');
                triggerEmoReaction('happy');
            }, 800); // Sirf 0.8 second ka fast intro
        }

        window.addEventListener('DOMContentLoaded', runIntroSequence);

        // =======================================================
        // 2. MQTT LIVE PIPELINE & STATE ENGINE (Non-Blocking)
        // =======================================================
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const TOPIC_RELAY = "dheeraj_emo_hub_9921/control/relay";
        const TOPIC_STATUS_WILDCARD = "dheeraj_emo_hub_9921/status/#";
        const CLIENT_ID = "emo_exec_pad_" + Math.random().toString(16).substr(2, 8);

        const states = { 1: false, 2: false, 3: false, 4: false };
        let mqttConnected = false;
        let packetCount = 0;
        let mqttClient = null;

        function triggerHaptic() {
            try {
                if ("vibrate" in navigator) navigator.vibrate(24);
            } catch (e) {}
        }

        function triggerEmoReaction(type) {
            const bezel = document.getElementById('emo-face-bezel');
            if (!bezel) return;
            bezel.className = 'emo-glass-bezel mood-' + type;
            setTimeout(() => {
                bezel.className = 'emo-glass-bezel';
            }, 850);
        }

        function cycleEmoMood() {
            const moods = ['happy', 'wink', 'surprised', 'sleepy'];
            const randomMood = moods[Math.floor(Math.random() * moods.length)];
            triggerEmoReaction(randomMood);
        }

        function setLog(text) {
            const mon = document.getElementById('log-monitor');
            if (mon) mon.innerText = text;
        }

        function updateCardUI(id, state) {
            states[id] = state;
            const tile = document.getElementById(`tile-${id}`);
            const statusLabel = document.getElementById(`status-${id}`);
            if (!tile) return;

            tile.classList.remove('trigger-pulse');
            void tile.offsetWidth;
            tile.classList.add('trigger-pulse');

            if (state) {
                tile.classList.add('active');
                if (statusLabel) statusLabel.innerText = "ONLINE";
            } else {
                tile.classList.remove('active');
                if (statusLabel) statusLabel.innerText = "STANDBY";
            }

            const activeCount = Object.values(states).filter(Boolean).length;
            const summary = document.getElementById('active-summary');
            if (summary) summary.innerText = `${activeCount} ACTIVE`;

            if (states[1] || states[2]) {
                document.body.classList.add('room-illuminated');
            } else {
                document.body.classList.remove('room-illuminated');
            }
        }

        function toggleRelay(id) {
            triggerHaptic();
            const nextState = !states[id];
            
            const mood = nextState ? 'happy' : 'wink';
            triggerEmoReaction(mood);
            updateCardUI(id, nextState);

            if (mqttConnected && mqttClient) {
                try {
                    const payload = JSON.stringify({ id: Number(id), state: nextState ? 1 : 0 });
                    const message = new Paho.MQTT.Message(payload);
                    message.destinationName = TOPIC_RELAY;
                    message.qos = 1;
                    mqttClient.send(message);
                    packetCount++;
                    document.getElementById('packet-counter').innerText = packetCount;
                    setLog(`DISPATCH CH-0${id} -> ${nextState ? 'ENGAGED' : 'IDLE'}`);
                } catch (e) {
                    setLog(`LOCAL CH-0${id} -> ${nextState ? 'ENGAGED' : 'IDLE'}`);
                }
            } else {
                packetCount++;
                document.getElementById('packet-counter').innerText = packetCount;
                setLog(`LOCAL CH-0${id} -> ${nextState ? 'ENGAGED' : 'IDLE'}`);
            }
        }

        function masterControl(turnOn) {
            triggerHaptic();
            triggerEmoReaction(turnOn ? 'happy' : 'surprised');
            for (let i = 1; i <= 4; i++) {
                if (states[i] !== turnOn) {
                    toggleRelay(i);
                }
            }
        }

        function triggerPhoneCommand(action) {
            triggerHaptic();
            triggerEmoReaction('wink');
            setLog(`PHONE ACTION -> ${action.toUpperCase()} DISPATCHED`);
        }

        function enableSimulationMode() {
            mqttConnected = false;
            const chip = document.getElementById('conn-chip');
            const text = document.getElementById('conn-text');
            if (chip && text) {
                chip.className = 'live-chip connected';
                text.innerText = "LOCAL ACTIVE";
            }
            setLog("Local Instant Engine Active");
        }

        function connectMQTT() {
            if (typeof Paho === 'undefined' || !Paho.MQTT) {
                enableSimulationMode();
                return;
            }

            try {
                mqttClient = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), CLIENT_ID);

                mqttClient.onMessageArrived = function (message) {
                    try {
                        const data = JSON.parse(message.payloadString);
                        updateCardUI(Number(data.id), Number(data.state) === 1);
                        packetCount++;
                        document.getElementById('packet-counter').innerText = packetCount;
                    } catch (e) {}
                };

                mqttClient.onConnectionLost = function () {
                    mqttConnected = false;
                    document.getElementById('conn-chip').className = 'live-chip disconnected';
                    document.getElementById('conn-text').innerText = "OFFLINE";
                    setTimeout(connectMQTT, 5000);
                };

                mqttClient.connect({
                    useSSL: true,
                    timeout: 2, // Timeout kam kar diya taaki lag na ho
                    onSuccess: function () {
                        mqttConnected = true;
                        const chip = document.getElementById('conn-chip');
                        const text = document.getElementById('conn-text');
                        if (chip && text) {
                            chip.className = 'live-chip connected';
                            text.innerText = "CONNECTED";
                        }
                        setLog("EMQX Cloud Linked Instantly!");
                        try { mqttClient.subscribe(TOPIC_STATUS_WILDCARD, { qos: 1 }); } catch (e) {}
                    },
                    onFailure: function () {
                        enableSimulationMode();
                    }
                });
            } catch (err) {
                enableSimulationMode();
            }
        }

        // Background mein connect hoga taaki UI load hone mein ek sec ka bhi delay na ho
        setTimeout(connectMQTT, 200);
    </script>

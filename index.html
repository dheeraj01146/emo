<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO // CYBER DECK OS PRO</title>
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg-color: #03050b;
            --panel-bg: rgba(10, 18, 32, 0.85);
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #fcee0a;
            --accent-warm: #ffb700;
            --text-main: #d8f8ff;
            --text-dim: #4b6e8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12), transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: background 0.5s ease;
            position: relative;
        }

        /* Ambient Glow when lights are ON */
        body.light-active {
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 183, 0, 0.25), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        }

        /* Fullscreen Cyber Boot Overlay */
        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020408;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #boot-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-core-ring {
            width: 90px;
            height: 90px;
            border: 2px dashed var(--accent-cyan);
            border-top-color: var(--accent-magenta);
            border-radius: 50%;
            animation: ringSpin 2s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .boot-core-inner {
            width: 50px;
            height: 50px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            border-radius: 50%;
            animation: corePulse 1s ease-in-out infinite alternate;
        }

        @keyframes ringSpin {
            100% { transform: rotate(360deg); }
        }

        @keyframes corePulse {
            0% { transform: scale(0.85); box-shadow: 0 0 5px var(--accent-cyan); }
            100% { transform: scale(1.15); box-shadow: 0 0 20px var(--accent-cyan); }
        }

        .boot-title {
            color: var(--accent-cyan);
            font-size: 1.15rem;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 12px var(--accent-cyan);
            min-height: 30px;
            padding: 0 15px;
        }

        .boot-progress-bar {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .boot-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-warm));
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.2s linear;
        }

        .boot-subtext {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 12px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .header h1 {
            font-size: 1.3rem;
            letter-spacing: 3px;
            color: var(--accent-cyan);
        }

        .status-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 5px 10px;
            font-size: 0.7rem;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            font-weight: bold;
        }

        .status-badge.online {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .status-badge.offline {
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        /* EMO Eye HUD */
        .hud-eye-box {
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hud-label {
            align-self: flex-start;
            font-size: 0.68rem;
            color: var(--accent-yellow);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .eyes-container {
            display: flex;
            gap: 28px;
            margin-bottom: 8px;
        }

        .eye {
            width: 44px;
            height: 48px;
            background: var(--accent-cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--accent-cyan);
            animation: emoBlink 4s infinite ease-in-out;
        }

        @keyframes emoBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.08); }
        }

        /* Grid Cards */
        .section-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 10px;
            padding: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card.active-glow {
            border-color: var(--accent-warm);
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.3), inset 0 0 10px rgba(255, 183, 0, 0.2);
            background: rgba(25, 22, 10, 0.85);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 8px; height: 8px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
            transition: border-color 0.3s;
        }

        .card.active-glow::before {
            border-top-color: var(--accent-warm);
            border-left-color: var(--accent-warm);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        /* Rotating Fan Animation */
        .fan-spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Toggle Switches */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0; height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #121e33;
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 20px;
            transition: .3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-dim);
            border-radius: 50%;
            transition: .3s;
        }

        input:checked + .slider {
            background-color: rgba(255, 183, 0, 0.25);
            border-color: var(--accent-warm);
            box-shadow: 0 0 12px rgba(255, 183, 0, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: var(--accent-warm);
            box-shadow: 0 0 8px var(--accent-warm);
        }

        /* Terminal Logs */
        .diag-box {
            background: #010307;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.7rem;
            color: var(--text-dim);
            line-height: 1.4;
            max-height: 140px;
            overflow-y: auto;
        }

        .diag-highlight {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <!-- Cyber Startup Animation Overlay -->
    <div id="boot-overlay">
        <div class="boot-core-ring">
            <div class="boot-core-inner"></div>
        </div>
        <div class="boot-title" id="boot-text"></div>
        <div class="boot-progress-bar">
            <div class="boot-progress-fill" id="boot-fill"></div>
        </div>
        <div class="boot-subtext">// INITIALIZING EMO AI LINK</div>
    </div>

    <!-- Main Header -->
    <div class="header">
        <div>
            <h1>EMO // CORE</h1>
            <div style="font-size: 0.6rem; color: var(--text-dim);">CYBER DECK OS // PRO CLOUD</div>
        </div>
        <div class="status-badge" id="net-status">CONNECTING...</div>
    </div>

    <!-- Live Eye HUD -->
    <div class="hud-eye-box">
        <div class="hud-label">// LIVE DYNAMIC EXPRESSION</div>
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div style="font-size: 0.65rem; color: var(--text-dim);">STATUS: SECURE 4G/5G CLOUD LINK</div>
    </div>

    <div class="section-title">
        <span>// AUTOMATION RELAYS</span>
        <span>MQTT SECURE CHANNEL</span>
    </div>

    <!-- 4 Relays Grid -->
    <div class="grid-2">
        <div class="card" id="card-1">
            <div class="card-top">
                <span class="card-icon" id="icon-1">💡</span>
                <label class="switch">
                    <input type="checkbox" id="switch-1" onchange="sendRelay(1, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-title">LIGHT 1</div>
        </div>

        <div class="card" id="card-2">
            <div class="card-top">
                <span class="card-icon" id="icon-2">💡</span>
                <label class="switch">
                    <input type="checkbox" id="switch-2" onchange="sendRelay(2, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-title">LIGHT 2</div>
        </div>

        <div class="card" id="card-3">
            <div class="card-top">
                <span class="card-icon" id="icon-3">🌀</span>
                <label class="switch">
                    <input type="checkbox" id="switch-3" onchange="sendRelay(3, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-title">FAN RELAY</div>
        </div>

        <div class="card" id="card-4">
            <div class="card-top">
                <span class="card-icon" id="icon-4">📺</span>
                <label class="switch">
                    <input type="checkbox" id="switch-4" onchange="sendRelay(4, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-title">TV POWER</div>
        </div>
    </div>

    <!-- Terminal Telemetry -->
    <div class="section-title">
        <span>// TERMINAL TELEMETRY</span>
    </div>
    <div class="diag-box" id="terminal-log">
        > SYSTEM: <span class="diag-highlight">ONLINE AND READY...</span>
    </div>

    <script>
        // --- STARTUP ANIMATION ENGINE ---
        const welcomeMessage = "HEY, WELCOME TO EMO AUTOMATION";
        const bootTextElement = document.getElementById("boot-text");
        const bootFillElement = document.getElementById("boot-fill");
        const bootOverlay = document.getElementById("boot-overlay");

        let charIndex = 0;
        function playBootSequence() {
            const typingInterval = setInterval(() => {
                bootTextElement.textContent += welcomeMessage.charAt(charIndex);
                charIndex++;
                const progress = Math.min((charIndex / welcomeMessage.length) * 100, 100);
                bootFillElement.style.width = progress + "%";

                if (charIndex >= welcomeMessage.length) {
                    clearInterval(typingInterval);
                    setTimeout(() => {
                        bootOverlay.classList.add("fade-out");
                    }, 900);
                }
            }, 45);
        }

        window.addEventListener("DOMContentLoaded", playBootSequence);

        // --- MQTT ENGINE ---
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const TOPIC_RELAY = "dheeraj_emo_hub_9921/control/relay";
        const TOPIC_STATUS_WILDCARD = "dheeraj_emo_hub_9921/status/#";
        const CLIENT_ID = "emo_web_" + Math.random().toString(16).substr(2, 8);

        let mqttConnected = false;
        const mqttClient = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), CLIENT_ID);

        function logToTerminal(msg) {
            const term = document.getElementById("terminal-log");
            term.innerHTML += `<br>> ${msg}`;
            term.scrollTop = term.scrollHeight;
        }

        function setStatus(text, statusClass) {
            const badge = document.getElementById("net-status");
            badge.innerText = text;
            badge.className = "status-badge " + statusClass;
        }

        function updateVisualState(id, state) {
            const card = document.getElementById(`card-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!card || !icon) return;

            if (state) {
                card.classList.add('active-glow');
                if (id === 3) icon.classList.add('fan-spinning');
            } else {
                card.classList.remove('active-glow');
                if (id === 3) icon.classList.remove('fan-spinning');
            }
            updateBackgroundAmbiance();
        }

        // Live Retained Sync from EMO Hub
        mqttClient.onMessageArrived = function (message) {
            try {
                const data = JSON.parse(message.payloadString);
                const id = Number(data.id);
                const state = (Number(data.state) === 1);

                const sw = document.getElementById(`switch-${id}`);
                if (sw) sw.checked = state;

                updateVisualState(id, state);
                logToTerminal(`Synced -> Device ${id} is [${state ? 'ON' : 'OFF'}]`);
            } catch (e) {
                console.error("Payload error", e);
            }
        };

        mqttClient.onConnectionLost = function () {
            mqttConnected = false;
            setStatus("DISCONNECTED", "offline");
            logToTerminal("MQTT Connection lost. Auto-reconnecting...");
            setTimeout(connectMQTT, 3000);
        };

        function connectMQTT() {
            setStatus("CONNECTING...", "");
            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                keepAliveInterval: 30,
                cleanSession: false,
                onSuccess: function () {
                    mqttConnected = true;
                    setStatus("CLOUD ONLINE", "online");
                    logToTerminal("MQTT Cloud Linked! Ready on 4G/5G/Wi-Fi.");
                    mqttClient.subscribe(TOPIC_STATUS_WILDCARD, { qos: 1 });
                },
                onFailure: function (err) {
                    mqttConnected = false;
                    setStatus("CONNECT ERROR", "offline");
                    setTimeout(connectMQTT, 5000);
                }
            });
        }

        function sendRelay(id, state) {
            const val = state ? 1 : 0;
            updateVisualState(id, state);

            if (mqttConnected) {
                const payload = JSON.stringify({ id: Number(id), state: Number(val) });
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_RELAY;
                message.qos = 1;
                mqttClient.send(message);
                logToTerminal(`Dispatched -> [Dev: ${id} | State: ${val}]`);
            } else {
                logToTerminal("Warning: MQTT offline hai!");
            }
        }

        function updateBackgroundAmbiance() {
            const l1 = document.getElementById('switch-1').checked;
            const l2 = document.getElementById('switch-2').checked;
            if (l1 || l2) {
                document.body.classList.add('light-active');
            } else {
                document.body.classList.remove('light-active');
            }
        }

        connectMQTT();
    </script>
</body>
</html>

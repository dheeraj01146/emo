<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO // CORE DASHBOARD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg-deep: #080a0f;
            --panel: #111622;
            --panel-active: #171f30;
            --border-dim: #1d2536;
            --border-highlight: rgba(0, 235, 255, 0.35);
            --cyan-glow: #00ebff;
            --amber-warm: #ffb300;
            --text-title: #f1f5f9;
            --text-sub: #7e8c9f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-title);
            min-height: 100vh;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            transition: background 0.4s ease;
        }

        body.room-lit {
            background-color: #0b0d12;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 179, 0, 0.12), transparent 70%);
        }

        /* --- Header & Live Responsive EMO Eyes --- */
        .hud-header {
            background: var(--panel);
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        .hud-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-title);
        }

        .status-pill {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: #090c12;
            border: 1px solid var(--border-dim);
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .status-pill.online {
            border-color: rgba(0, 230, 118, 0.4);
            color: #00e676;
        }

        /* EMO Interactive Screen */
        .emo-display-box {
            width: 140px;
            height: 70px;
            background: #020408;
            border-radius: 16px;
            border: 1px solid rgba(0, 235, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 235, 255, 0.1);
        }

        .emo-eye {
            width: 38px;
            height: 44px;
            background: var(--cyan-glow);
            border-radius: 12px;
            box-shadow: 0 0 14px var(--cyan-glow), inset -2px -2px 6px rgba(0, 150, 180, 0.8);
            transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: emoBlink 4.5s infinite ease-in-out;
        }

        @keyframes emoBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.08); }
        }

        /* EMO Dynamic Reaction States */
        .emo-display-box.react-wink #eye-right {
            transform: scaleY(0.1);
        }

        .emo-display-box.react-happy .emo-eye {
            border-radius: 20px 20px 8px 8px;
            transform: scaleY(0.65) translateY(-3px);
        }

        /* --- Section Label --- */
        .section-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
        }

        /* --- 2x2 Grid (Pehle Wale Size Me) --- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.25s ease, 
                        background 0.25s ease, 
                        box-shadow 0.25s ease;
            overflow: hidden;
        }

        /* Mechanical Button Tap Animation */
        .card:active {
            transform: scale(0.96) translateY(2px);
        }

        .card.active-state {
            background: var(--panel-active);
            border-color: rgba(255, 179, 0, 0.45);
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.22);
        }

        /* Ripple Flash Animation on Toggle */
        .card.ripple-flash::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 180%; height: 180%;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.25) 0%, transparent 60%);
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 0.4s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            font-size: 1.45rem;
            transition: transform 0.25s ease;
        }

        .fan-rotate {
            animation: spinFan 0.9s linear infinite;
        }

        @keyframes spinFan {
            100% { transform: rotate(360deg); }
        }

        .card-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-title);
            letter-spacing: 0.2px;
        }

        .card-sub {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* --- Classic Toggle Switch --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0; height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #0c1017;
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            transition: 0.25s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-sub);
            border-radius: 50%;
            transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        input:checked + .slider {
            background-color: rgba(255, 179, 0, 0.2);
            border-color: var(--amber-warm);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: var(--amber-warm);
            box-shadow: 0 0 8px var(--amber-warm);
        }

        /* Clean Terminal Log */
        .telemetry-box {
            background: #06080c;
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.7rem;
            color: var(--text-sub);
            font-family: monospace;
            display: flex;
            justify-content: space-between;
        }

        .telemetry-box b {
            color: var(--cyan-glow);
        }
    </style>
</head>
<body>

    <!-- Top HUD with Interactive EMO Face -->
    <div class="hud-header">
        <div class="hud-top-bar">
            <div class="hud-title">EMO RELAY HUB</div>
            <div class="status-pill" id="net-badge">CONNECTING...</div>
        </div>

        <div class="emo-display-box" id="emo-screen">
            <div class="emo-eye" id="eye-left"></div>
            <div class="emo-eye" id="eye-right"></div>
        </div>
    </div>

    <div class="section-tag">
        <span>APPLIANCES</span>
        <span>MQTT WIRELESS</span>
    </div>

    <!-- 2x2 Clean Grid -->
    <div class="grid-2">
        <!-- Light 1 -->
        <div class="card" id="card-1">
            <div class="card-top">
                <span class="card-icon" id="icon-1">💡</span>
                <label class="switch">
                    <input type="checkbox" id="switch-1" onchange="sendRelay(1, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <div class="card-title">LIGHT 1</div>
                <div class="card-sub">GPIO 18</div>
            </div>
        </div>

        <!-- Light 2 -->
        <div class="card" id="card-2">
            <div class="card-top">
                <span class="card-icon" id="icon-2">💡</span>
                <label class="switch">
                    <input type="checkbox" id="switch-2" onchange="sendRelay(2, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <div class="card-title">LIGHT 2</div>
                <div class="card-sub">GPIO 19</div>
            </div>
        </div>

        <!-- Fan -->
        <div class="card" id="card-3">
            <div class="card-top">
                <span class="card-icon" id="icon-3">🌀</span>
                <label class="switch">
                    <input type="checkbox" id="switch-3" onchange="sendRelay(3, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <div class="card-title">COOLING FAN</div>
                <div class="card-sub">GPIO 21</div>
            </div>
        </div>

        <!-- TV -->
        <div class="card" id="card-4">
            <div class="card-top">
                <span class="card-icon" id="icon-4">📺</span>
                <label class="switch">
                    <input type="checkbox" id="switch-4" onchange="sendRelay(4, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <div class="card-title">TELEVISION</div>
                <div class="card-sub">GPIO 22</div>
            </div>
        </div>
    </div>

    <!-- Telemetry Bar -->
    <div class="telemetry-box">
        <span>CHANNEL: <b>ESP-NOW ACTIVE</b></span>
        <span id="log-status">SYSTEM READY</span>
    </div>

    <script>
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const TOPIC_RELAY = "dheeraj_emo_hub_9921/control/relay";
        const TOPIC_STATUS_WILDCARD = "dheeraj_emo_hub_9921/status/#";
        const CLIENT_ID = "emo_web_core_" + Math.random().toString(16).substr(2, 8);

        let mqttConnected = false;
        const mqttClient = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), CLIENT_ID);

        function triggerHaptic() {
            if ("vibrate" in navigator) navigator.vibrate(22);
        }

        // Button dabane par EMO Face ka reaction
        function triggerEmoReaction(isOn) {
            const screen = document.getElementById("emo-screen");
            const reactionClass = isOn ? "react-happy" : "react-wink";
            screen.classList.add(reactionClass);

            setTimeout(() => {
                screen.classList.remove(reactionClass);
            }, 550);
        }

        function updateVisualState(id, state) {
            const card = document.getElementById(`card-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!card || !icon) return;

            // Trigger ripple effect
            card.classList.remove("ripple-flash");
            void card.offsetWidth;
            card.classList.add("ripple-flash");

            if (state) {
                card.classList.add('active-state');
                if (id === 3) icon.classList.add('fan-rotate');
            } else {
                card.classList.remove('active-state');
                if (id === 3) icon.classList.remove('fan-rotate');
            }

            // Room ambient glow check
            const l1 = document.getElementById('switch-1').checked;
            const l2 = document.getElementById('switch-2').checked;
            if (l1 || l2) {
                document.body.classList.add('room-lit');
            } else {
                document.body.classList.remove('room-lit');
            }
        }

        function sendRelay(id, state) {
            triggerHaptic();
            triggerEmoReaction(state);
            updateVisualState(id, state);

            if (mqttConnected) {
                const payload = JSON.stringify({ id: Number(id), state: state ? 1 : 0 });
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_RELAY;
                message.qos = 1;
                mqttClient.send(message);
                document.getElementById("log-status").innerText = `SENT DEV ${id} -> ${state ? 'ON' : 'OFF'}`;
            }
        }

        // Live Retained Sync from ESP32
        mqttClient.onMessageArrived = function (message) {
            try {
                const data = JSON.parse(message.payloadString);
                const id = Number(data.id);
                const state = (Number(data.state) === 1);

                const sw = document.getElementById(`switch-${id}`);
                if (sw && sw.checked !== state) {
                    sw.checked = state;
                    updateVisualState(id, state);
                }
                document.getElementById("log-status").innerText = `SYNC DEV ${id}: ${state ? 'ON' : 'OFF'}`;
            } catch (e) {}
        };

        mqttClient.onConnectionLost = function () {
            mqttConnected = false;
            const badge = document.getElementById("net-badge");
            badge.innerText = "OFFLINE";
            badge.className = "status-pill";
            setTimeout(connectBroker, 3000);
        };

        function connectBroker() {
            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                keepAliveInterval: 30,
                cleanSession: false,
                onSuccess: function () {
                    mqttConnected = true;
                    const badge = document.getElementById("net-badge");
                    badge.innerText = "ONLINE";
                    badge.className = "status-pill online";
                    mqttClient.subscribe(TOPIC_STATUS_WILDCARD, { qos: 1 });
                },
                onFailure: function () {
                    mqttConnected = false;
                    setTimeout(connectBroker, 5000);
                }
            });
        }

        connectBroker();
    </script>
</body>
</html>

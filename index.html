<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO // CYBER DECK OS</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(11, 20, 38, 0.75);
            --border-glow: #00f3ff;
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #fcee0a;
            --text-main: #d8f8ff;
            --text-dim: #4b6e8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.15), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .header h1 {
            font-size: 1.4rem;
            letter-spacing: 3px;
            color: var(--accent-cyan);
        }

        .status-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-cyan)); }
        }

        /* EMO Eye Simulator */
        .hud-eye-box {
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .hud-label {
            align-self: flex-start;
            font-size: 0.7rem;
            color: var(--accent-yellow);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .eyes-container {
            display: flex;
            gap: 24px;
            margin-bottom: 10px;
        }

        .eye {
            width: 48px;
            height: 52px;
            background: var(--accent-cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--accent-cyan);
            animation: emoBlink 4s infinite ease-in-out;
        }

        @keyframes emoBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.08); }
        }

        /* Grid Cards */
        .section-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 14px;
            position: relative;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 8px; height: 8px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            font-size: 1.4rem;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Toggle Switches */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0; height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a2a44;
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 20px;
            transition: .3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-dim);
            border-radius: 50%;
            transition: .3s;
        }

        input:checked + .slider {
            background-color: rgba(0, 243, 255, 0.25);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Bluetooth Media Section */
        .media-deck {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 8px;
            padding: 14px;
            position: relative;
        }

        .media-deck::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 8px; height: 8px;
            border-top: 2px solid var(--accent-magenta);
            border-left: 2px solid var(--accent-magenta);
        }

        .media-buttons {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-cyber {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--accent-magenta);
            color: #fff;
            padding: 10px 14px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-cyber:active {
            background: var(--accent-magenta);
            box-shadow: 0 0 12px var(--accent-magenta);
            transform: scale(0.96);
        }

        /* Diagnostic Box */
        .diag-box {
            background: #020409;
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.4;
            max-height: 160px;
            overflow-y: auto;
        }

        .diag-highlight {
            color: var(--accent-cyan);
        }
    </style>
</head>
